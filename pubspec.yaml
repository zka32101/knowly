name: knowly
description: "Knowly（雑学コレ！）— 就学前から大人まで、世界中で楽しめる雑学アプリ。"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.6.1
  go_router: ^14.0.0
  shared_preferences: ^2.3.0
  flutter_tts: ^4.0.2
  # クロスプロモーション（Teen/Adult のみで表示。Kids/Junior では読み込まない）
  firebase_core: ">=3.0.0 <5.0.0"
  cross_promo_kit:
    git:
      url: https://github.com/zka32101/cross_promo_kit
      ref: v0.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/trivia/
